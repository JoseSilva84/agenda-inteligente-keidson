version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_inteligente}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agenda_inteligente}']
      interval: 10s
      timeout: 5s
      retries: 5

  agenda-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3333}:3333'
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agenda_inteligente}?schema=public
      JWT_SECRET: ${JWT_SECRET:-agenda-inteligente-apple-jwt-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-keidson.rodrigues}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-troque_por_uma_senha_forte}
      ADMIN_NAME: ${ADMIN_NAME:-Pr. Keidson Rodrigues}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:suporte@localhost}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PUSH_TIMEZONE: ${PUSH_TIMEZONE:-America/Fortaleza}

volumes:
  postgres_data:
