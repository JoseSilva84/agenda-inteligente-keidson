<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700&family=Figtree:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* layout: app shell, sidebar + time grid canvas; bottom nav on phones */
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#141A2E; --muted:#5A627A; --line:#E1E4EE; --soft:#EDF0FA;
  --accent:#2A4CDB; --accent-ink:#FFFFFF;
  --ok:#0F8458; --warn:#A86500; --bad:#C3304A;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:10px; --shadow:0 10px 30px rgba(20,26,46,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#161A2B; --ink:#E7EAF5; --muted:#99A1BB; --line:#272D45; --soft:#1C2240;
    --accent:#7F97FF; --accent-ink:#0E1120; --ok:#3DCB8F; --warn:#F0B04A; --bad:#FF6F86;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#161A2B; --ink:#E7EAF5; --muted:#99A1BB; --line:#272D45; --soft:#1C2240;
  --accent:#7F97FF; --accent-ink:#0E1120; --ok:#3DCB8F; --warn:#F0B04A; --bad:#FF6F86;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:18px} h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.tabs{display:flex;gap:2px}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;position:relative}
.tab:hover{background:var(--soft);color:var(--ink)}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.badge:empty{display:none}
.reddot{width:9px;height:9px;border-radius:50%;background:#E5263B;display:inline-block;flex:none;box-shadow:0 0 0 2px var(--surface)}
.bottomnav .tab{position:relative}
.bottomnav .reddot{position:absolute;top:6px;left:calc(50% + 8px)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px;width:230px;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink);position:relative}
.iconbtn .badge{position:absolute;top:-6px;right:-6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);height:36px;padding:0 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn-danger{color:var(--bad)}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{display:none;padding:8px 16px;font-size:13.5px;background:var(--soft);border-bottom:1px solid var(--line)}
.banner.show{display:block}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
#main{flex:1;min-height:0;overflow:auto}
.bottomnav{display:none}

/* Agenda */
.agenda{display:grid;grid-template-columns:250px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--font-body);font-weight:700;margin-bottom:8px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700;text-transform:capitalize}
.mini-h button{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.mini span{color:var(--muted);font-size:11px;padding:2px 0}
.mini button{border:0;background:none;border-radius:7px;padding:5px 0 7px;position:relative;font-variant-numeric:tabular-nums}
.mini button:hover{background:var(--soft)}
.mini button.out{color:var(--muted);opacity:.55}
.mini button.today{color:var(--accent);font-weight:800}
.mini button.sel{background:var(--accent);color:var(--accent-ink)}
.mini button.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor;opacity:.6}
.cats{display:flex;flex-direction:column;gap:4px}
.cats label{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:7px;cursor:pointer}
.cats label:hover{background:var(--soft)}
.cats input{accent-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c,#888);flex:none;display:inline-block}
.todaylist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:none;padding:6px;border-radius:8px;width:100%}
.trow:hover{background:var(--soft)}
.trow small{display:block;color:var(--muted);font-size:12px}
.trow .dot{margin-top:5px}
.pendcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg)}
.pendcard b{font-size:22px;font-family:var(--font-display)}
.muted{color:var(--muted)}
.small{font-size:13px}
.store-chip{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

.cal{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.toolbar h2{font-size:16px;margin-left:6px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tb-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.welcome{margin:12px 16px 0;padding:14px 16px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--soft);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.welcome p{margin:0;flex:1;min-width:220px}

.g-scroll{flex:1;overflow:auto;position:relative;background:var(--surface)}
.g-inner{min-width:100%}
.g-inner.n7{min-width:720px}
.g-top{position:sticky;top:0;z-index:5;background:var(--surface)}
.g-head{display:grid;grid-template-columns:76px repeat(var(--n),minmax(0,1fr));background:var(--surface);border-bottom:1px solid var(--line)}
.g-gut{display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);border-right:1px solid var(--line)}
.g-day{border:0;border-left:1px solid var(--line);background:none;padding:12px 4px;display:grid;place-items:center;color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em;text-align:center;text-wrap:balance;font-variant-numeric:tabular-nums}
.g-day span{padding:3px 8px}
.g-day:hover span{background:var(--soft)}
.g-day.is-today span{background:var(--accent);color:var(--accent-ink)}
.g-body{display:grid;grid-template-columns:76px repeat(var(--n),minmax(0,1fr))}
.agenda.side-hidden{grid-template-columns:minmax(0,1fr)}
.agenda.side-hidden .side{display:none}
.year-wrap{flex:1;overflow:auto;background:var(--surface)}
.year{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 26px;padding:20px}
.y-h{border:0;background:none;padding:2px 0;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--ink);margin-bottom:6px}
.y-h:hover{color:var(--accent)}
.y-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.y-grid span{color:var(--muted);font-size:10.5px;font-weight:700;padding:2px 0}
.y-grid button{border:0;background:none;padding:5px 0;border-radius:2px}
.y-grid button:hover{outline:1px solid var(--accent)}
.y-grid button.l1{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.y-grid button.l2{background:color-mix(in srgb,var(--accent) 36%,transparent)}
.y-grid button.l3{background:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent-ink)}
.y-grid button.today{outline:2px solid var(--bad);font-weight:800}
.y-legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);padding:0 20px 18px}
.y-legend i{display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-2px}
.g-hours{position:relative}
.g-hours span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.g-col{position:relative;border-left:1px solid var(--line);cursor:text;user-select:none;touch-action:manipulation;
  background-image:linear-gradient(color-mix(in srgb,var(--muted) 28%,var(--line)) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);
  background-size:100% var(--pph),100% calc(var(--pph) / 4)}
.g-col:hover{background-color:color-mix(in srgb,var(--accent) 3%,transparent)}
.quick{position:absolute;z-index:6;background:var(--surface);border:1.5px solid var(--accent);border-radius:2px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.quick input{border:0;background:none;outline:none;width:100%;height:100%;padding:0 6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.selbox{position:absolute;z-index:5;pointer-events:none;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1.5px solid var(--accent);border-radius:2px;font-size:11.5px;font-weight:700;color:var(--accent);padding:1px 6px;font-variant-numeric:tabular-nums}
.ev-inp{width:100%;border:0;border-bottom:1px solid var(--accent);background:transparent;font:700 12.5px var(--font-body);color:var(--ink);outline:none;padding:0}
.ev.short{display:flex;align-items:center;gap:6px;padding:0 6px}
.ev.short .ev-t{min-width:0}
.ev.short .ev-m{flex:1 1 0;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.ev-top{display:flex;align-items:center;gap:4px;min-width:0}
.ev-top .ev-t{flex:1 1 auto;min-width:0}
.ev-ic{display:inline-flex;align-items:center;gap:2px;flex:none;opacity:.8;font-size:10.5px;font-variant-numeric:tabular-nums}
.ev-ic svg.i{width:13px;height:13px}
.ev.short .ev-top{flex:0 1 auto;min-width:45%}
.chip .ev-ic svg.i{width:11px;height:11px}
.subs{display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line)}
.sub .subno{font-size:11.5px;color:var(--muted);min-width:30px;font-variant-numeric:tabular-nums}
.sub .sub-txt{flex:1 1 100px;min-width:90px}
.sub .sub-date{flex:0 0 124px}
.sub .sub-time{flex:0 0 100px}
.sub .sub-dur{flex:0 0 90px;border:1px solid var(--line);background:var(--bg)}
.sub .sub-date,.sub .sub-time{border:1px solid var(--line);background:var(--bg)}
.ev.subev{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.subn{display:inline-block;font-size:10.5px;padding:0 4px;margin-right:4px;background:color-mix(in srgb,var(--c) 55%,var(--surface));font-variant-numeric:tabular-nums}
.sub input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;flex:none}
.sub .sub-txt{border-color:transparent;background:transparent}
.sub .sub-txt:focus{border-color:var(--line);background:var(--bg)}
.sub.done .sub-txt{text-decoration:line-through;color:var(--muted)}
.sub button{border:0;background:none;color:var(--muted);width:28px;height:28px}
.pdfpages{width:100%;height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pdfpages canvas{max-width:100%;box-shadow:0 1px 6px rgba(0,0,0,.2);background:#fff}
.side-tg{border:0;background:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;opacity:.7}
.side-tg:hover{opacity:1;color:var(--ink);background:var(--soft)}
.side-tg[aria-pressed="false"]{color:var(--accent);opacity:1}
.clipchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--soft);border:1px solid var(--line);padding:3px 4px 3px 10px;max-width:420px}
.clipchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.clipchip .x{border:0;background:none;color:var(--muted);width:24px;height:24px}
body.pasting .g-col{cursor:copy}
body.pasting .clipchip{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.g-col.off{background-color:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.offh{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--line) 32%,transparent);pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.ev{position:absolute;border-radius:2px;padding:3px 7px 4px;font-size:12.5px;line-height:1.25;overflow:hidden;cursor:grab;touch-action:none;user-select:none;
  background:color-mix(in srgb,var(--c) 36%,var(--surface));border:0;z-index:2}
.g-body{position:relative}
.g-span{position:absolute;top:0;left:76px;right:0;pointer-events:none;z-index:3}
.g-span > *{pointer-events:auto}
.g-span .selbox{pointer-events:none}
.ev:hover{z-index:3;filter:brightness(.97)}
.ev-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-m{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev .rzx{position:absolute;top:0;right:0;bottom:7px;width:8px;cursor:ew-resize}
.ev:hover .rzx{background:linear-gradient(90deg,transparent 3px,color-mix(in srgb,var(--c) 70%,transparent) 3px 5px,transparent 5px)}
.selbox.ghostspan{border-style:dashed}
.ev.dragging{opacity:.85;box-shadow:var(--shadow);z-index:10;cursor:grabbing}
.st-concluida{opacity:.62}
.st-concluida .ev-t,.chip.st-concluida{text-decoration:line-through;text-decoration-thickness:1.5px}
.st-pendente{}
.st-cancelada{opacity:.42}
.st-cancelada .ev-t{text-decoration:line-through}
.warnmark{color:var(--bad);font-weight:800;margin-right:3px}

.month{flex:1;display:grid;grid-template-rows:auto 1fr;min-height:520px;background:var(--surface)}
.m-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.m-head .short{display:none}
.m-head span{padding:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,1fr)}
.m-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:copy}
.m-cell.out{background:var(--bg)}
.m-cell.out .m-num{opacity:.5}
.m-cell.drop{outline:2px solid var(--accent);outline-offset:-2px}
.m-num{border:0;background:none;align-self:flex-start;font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;font-variant-numeric:tabular-nums}
.m-cell.today .m-num{background:var(--accent);color:var(--accent-ink)}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:2px 6px;border-radius:2px;background:color-mix(in srgb,var(--c) 30%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;user-select:none}
.chip i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.chip.st-pendente{}
.m-more{border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:0 6px}
.ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:var(--shadow);opacity:.95}

.listwrap{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:900px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lgroup h3{font-size:13px;color:var(--muted);text-transform:capitalize;margin:0 0 6px}
.lrow{width:100%;display:grid;grid-template-columns:12px 110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;text-align:left;margin-bottom:6px}
.lrow:hover{border-color:var(--accent)}
.lrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.p-concluida{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.p-pendente{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.p-cancelada{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.p-reagendada{background:var(--soft);color:var(--accent)}
.pill.p-alta{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}

/* Pages */
.page{max-width:980px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flow div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.flow b{display:block;font-family:var(--font-display)}
.flow small{color:var(--muted)}
.flow em{font-style:normal;font-family:var(--font-display);color:var(--accent);font-weight:700;margin-right:6px}
.modecard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.modecard p{margin:0;flex:1;min-width:240px;color:var(--muted)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px}
.prow.is-conflict{border-left-color:var(--bad)}
.prow-main{display:flex;gap:10px;align-items:flex-start;min-width:0}
.prow-main .dot{margin-top:6px}
.prow-main span{display:block;color:var(--muted);font-size:13px}
.prow-sug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.prow-sug .err{color:var(--bad);width:100%}
.prow-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--tc,var(--accent))}
.tile b{display:block;font-family:var(--font-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.chart .v{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.catbar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.catbar .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;position:relative}
.catbar .track i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--c);opacity:.35}
.catbar .track u{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--c)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.simple{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.simple li{display:flex;gap:10px;align-items:center;font-size:14px}
.simple li .muted{margin-left:auto;font-size:12.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:14.5px;min-width:0}
.inp{padding:6px 8px;font-size:13.5px}
.field textarea{resize:vertical;min-height:70px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.check input{accent-color:var(--accent);width:16px;height:16px}
.catedit{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.catedit input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.roadmap li{margin-bottom:6px}

/* Modal */
#modal-root .overlay{position:fixed;inset:0;background:rgba(10,13,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(680px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column}
.modal.sm{width:min(440px,100%)}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.m-h input.title{flex:1;border:0;border-bottom:2px solid var(--line);background:none;font-family:var(--font-display);font-size:22px;font-weight:700;padding:4px 2px;outline:none;color:var(--ink);min-width:0}
.m-h input.title:focus{border-color:var(--accent)}
.m-b{padding:12px 18px;display:flex;flex-direction:column;gap:14px}
.m-f{padding:12px 18px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.m-f .sp{flex:1}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:10px}
.trip{position:absolute;left:0;right:0;z-index:1;pointer-events:none;background:color-mix(in srgb,var(--ink) 13%,transparent)}
.trip-l{position:absolute;left:4px;right:4px;top:2px;pointer-events:auto;border:0;background:var(--ink);color:var(--surface);font-size:11.5px;text-align:left;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;z-index:4}
.m-cell.trip-day{background:color-mix(in srgb,var(--ink) 11%,var(--surface))}
.m-trip{border:0;background:var(--ink);color:var(--surface);font-size:11px;text-align:left;padding:1px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.y-grid button.trip-day{box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.kind-seg{align-self:flex-start}
.pe-add{display:flex;gap:8px;flex-wrap:wrap}
.pe-add #pe-name{flex:1 1 200px}.pe-add #pe-role{flex:1 1 180px}.pe-add #pe-wa{flex:0 1 170px}
.prow2{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow2 .inp{border-color:transparent;background:transparent}
.prow2 .inp:focus{border-color:var(--line);background:var(--bg)}
.prow2 [data-pe-f=name]{flex:1 1 200px}.prow2 [data-pe-f=role]{flex:1 1 160px}.prow2 [data-pe-f=whatsapp]{flex:0 1 160px}
.prow2 .pdate{width:52px;color:var(--muted)}
.sh{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--muted);border:0;background:none}
.sh:hover{color:var(--accent);background:var(--soft)}
.plist li{justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.g-allday{display:grid;grid-template-columns:76px repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--line)}
.g-allday .g-gut{font-size:9.5px}
.ad-cell{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ad-chip,.m-pchip{display:flex;align-items:center;gap:5px;border:0;width:100%;text-align:left;font-size:11.5px;padding:2px 6px;background:color-mix(in srgb,var(--c) 30%,var(--surface));color:var(--ink);overflow:hidden;white-space:nowrap;cursor:pointer}
.ad-chip span,.m-pchip span{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ad-chip svg.i,.m-pchip svg.i{width:13px;height:13px}
.ad-chip b,.m-pchip b{font-size:11px;padding:0 5px;background:color-mix(in srgb,var(--c) 60%,var(--surface))}
.pick-wrap{display:flex;flex-direction:column;gap:6px;max-width:340px}
.pick-h{display:flex;align-items:center;justify-content:space-between;color:var(--ink);text-transform:capitalize}
.pick-h button{border:0;background:none;color:var(--muted);width:30px;height:30px}
.pick{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.pick span{font-size:11px;color:var(--muted);padding:2px 0}
.pick button{border:1px solid var(--line);background:var(--bg);padding:6px 0;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.pick button.out{visibility:hidden}
.pick button.today{border-color:var(--accent)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.share{display:inline-flex;gap:6px;flex-wrap:wrap}
.sub .sh{display:inline-grid;place-items:center;width:28px;height:28px;color:var(--muted)}
.sub .sh:hover{color:var(--accent);background:var(--soft)}
.sect{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sect h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-body)}
.info{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--soft)}
.info.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:13px;cursor:pointer}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .k{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:5px;padding:2px 6px;text-transform:uppercase}
.addlink{display:grid;grid-template-columns:1.4fr 1fr auto;gap:6px}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.err-msg{color:var(--bad);font-size:13px;font-weight:600}
.modal.viewer{width:min(1000px,100%);height:min(88vh,900px)}
.viewer-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.viewer-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-h div{display:flex;gap:6px}
.viewer-b{flex:1;min-height:0;display:grid;place-items:center;background:var(--bg)}
.viewer-b img,.viewer-b video{max-width:100%;max-height:100%}
.viewer-b iframe{width:100%;height:100%;border:0;background:#fff}
.viewer-b pre{width:100%;height:100%;margin:0;padding:16px;overflow:auto;white-space:pre-wrap}

/* Notifications */
.pop{position:absolute;right:16px;top:56px;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.nrow{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.nrow.unread{background:var(--soft)}
.nrow b{display:block}
.nrow small{color:var(--muted)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:14px}
.toast.warn{background:var(--warn);color:#fff}

/* Chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:calc(100% - 20px)}
.chat-log{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .st{color:var(--muted);font-size:13px;font-style:italic}
.msg .er{color:var(--bad);font-size:13px;margin-top:4px}
.prop{margin-top:10px;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--soft)}
.prop ul{margin:6px 0 10px;padding-left:18px}
.prop.done{border-color:var(--ok)}
.prop.discarded{opacity:.6;border-style:dashed}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.chat-form{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.chat-form textarea{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;resize:none;min-height:44px;max-height:140px}

@media (max-width: 1440px){
  .search{width:170px}
  .tab{padding:8px 8px;gap:5px}
  .top{gap:10px}
}
@media (max-width: 1180px){
  .tab svg.i{display:none}
  .newlbl{display:none}
}
@media (max-width: 900px){
  .agenda{grid-template-columns:1fr}
  .side{display:none}
  .search{width:150px}
  .two{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr}
  .prow-act{justify-content:flex-start}
}
@media (max-width: 720px){
  .tabs{display:none}
  .top{padding:8px 12px;gap:8px}
  .brand span{display:none}
  .search{width:auto;flex:1}
  .top-r{flex:1}
  .newlbl{display:none}
  .side-tg{display:none}
  .bottomnav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav .tab{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:7px 2px;border-radius:0}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .flow{grid-template-columns:1fr}
  .form-grid,.row3{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:10px 84px minmax(0,1fr);}
  .lrow .pill{grid-column:3}
  .msg{max-width:92%}
  #toasts{bottom:76px}
  .toolbar h2{font-size:16px;width:100%;order:5;margin:0}
  .m-grid{grid-auto-rows:minmax(84px,1fr)}
  .chip{font-size:11px;padding:1px 4px}
  .chip .tm{display:none}
  .year{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:12px}
  .m-head .full{display:none}
  .hint{display:none}
}
*,*::before,*::after{font-weight:300 !important}
.brand span{font-weight:700 !important;font-size:14.4px;letter-spacing:.02em}
svg.i{stroke-width:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="mark"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M13.5 13.5h3M7.5 17h3"/></svg></div><span>AGENDA INTELIGENTE</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="top-r">
      <label class="search" for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="Pesquisar atividades" autocomplete="off"></label>
      <button class="iconbtn" id="bell" aria-label="Notificações"><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="badge" id="bellcount"></span></button>
      <button class="btn btn-primary" data-act="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="newlbl">Nova atividade</span></button>
    </div>
  </header>
  <div class="banner" id="banner" role="status"></div>
  <main id="main"></main>
  <nav class="bottomnav" id="bnav"></nav>
</div>
<div id="pop-root"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constantes e utilidades ---------- */
const HOUR_START = 4, HOUR_END = 24, PPH = 80, QH = PPH / 4;
const WD = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WD_LONG = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const STATUS = {planejada:'Planejada', concluida:'Concluída', pendente:'Pendente', cancelada:'Cancelada', reagendada:'Remarcada'};
const PRIO = {alta:{label:'Alta',w:0}, media:{label:'Média',w:1}, baixa:{label:'Baixa',w:2}};
const REMINDERS = [[0,'Sem lembrete'],[10,'10 min antes'],[30,'30 min antes'],[60,'1 hora antes'],[1440,'1 dia antes']];
const LSK = 'agenda-inteligente-v1';
const WD_EN = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
const MONTHS_EN = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const ICON = {
  agenda:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  pend:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4M12 8v4l3 2"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',

  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
  note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/>',
  check:'<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="m8 12 3 3 5-6"/>',
  yt:'<rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="m10 9 5 3-5 3z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 7 8.5-7"/>',
  gcal:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 12.5v5M9.5 15h5"/>',
  cake:'<path d="M4 21h16M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7M5 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 5 0M12 12V8M12 5.5c.8-.8.8-1.7 0-2.5-.8.8-.8 1.7 0 2.5z"/>',
  clip:'<path d="m21 11.5-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/>',
  rep:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  wa:'<path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a5 5 0 0 1-2.2-2.2l.8-1-1-2z"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>'
};
const ic = (n, s) => `<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${ICON[n]}</svg>`;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addY = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => parse(s).getDay();

const stableStr = v => v == null ? null : JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.keys(x).sort().reduce((o, kk) => (o[kk] = x[kk], o), {}) : x);

  shadow:new Map(), undo:[], redo:[], pending:null, applying:false,
  seedAll(){
    this.shadow = new Map();
    for (const m of [S.items, S.travels, S.people]) for (const [id] of m) this.shadow.set(id, stableStr(currentDoc(id)));
    if (S.settings) this.shadow.set('settings', stableStr(currentDoc('settings')));
  },
  record(docId){
    if (docId === 'notifs') return;
    const cur = stableStr(currentDoc(docId)), prev = this.shadow.has(docId) ? this.shadow.get(docId) : null;
    if (cur === null) this.shadow.delete(docId); else this.shadow.set(docId, cur);

    if (!this.pending) {
      this.pending = [];
      setTimeout(() => { const g = this.pending; this.pending = null; if (g && g.length) { this.undo.push(g); if (this.undo.length > 60) this.undo.shift(); this.redo = []; } }, 0);
    }

    if (e) e.next = cur; else this.pending.push({id:docId, prev, next:cur});
  },
  label(g){
    const e = g[0]; const v = JSON.parse(e.prev || e.next || 'null') || {};

  },

        if (val) { const map = val.kind === 'activity' ? S.items : val.kind === 'travel' ? S.travels : val.kind === 'person' ? S.people : null; if (map) map.set(e.id, {...val, id:e.id}); }

  },
  doRedo(){
    const g = this.redo.pop(); if (!g) { toast('Nada para refazer.'); return; }
    this.apply(g, 'redo'); this.undo.push(g); toast(`Refeito ${this.label(g)}.`);
  }
};

function blobToB64(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }

const FileStore = {
  idb:null,
  openIdb(){

/* ---------- ocorrências ---------- */
function matches(it, d){
  const r = it.recur;
  if (d < it.date) return false;
  if (r.until && d > r.until) return false;
  switch (r.freq) {
    case 'daily': return true;
    case 'weekdays': { const g = dow(d); return g >= 1 && g <= 5; }
    case 'weekly': return ((r.days && r.days.length) ? r.days : [dow(it.date)]).includes(dow(d));
    case 'monthly': return parse(d).getDate() === parse(it.date).getDate();
    case 'custom': return (r.dates || []).includes(d);
  }
  return false;
}
function occ(it, origDate, ov){
  const rec = isRec(it);
  return {
    key: rec ? it.id + '@' + origDate : it.id, id: it.id, item: it, origDate,
    date: (ov && ov.date) || origDate, start: (ov && ov.start) || it.start, end: (ov && ov.end) || it.end,
    status: rec ? ((ov && ov.status) || 'planejada') : (it.status || 'planejada'), rec
  };
}
function expand(from, to){
  const out = [];
  for (const it of S.items.values()) {
    if (!isRec(it)) { if (it.date >= from && it.date <= to) out.push(occ(it, it.date, null)); continue; }
    let lo = addY(from, -31); if (it.date > lo) lo = it.date;
    let hi = addY(to, 31); if (it.recur.until && it.recur.until < hi) hi = it.recur.until;
    for (let d = lo, n = 0; d <= hi && n < 1000; d = addY(d, 1), n++) {
      if (!matches(it, d)) continue;
      const ov = it.overrides && it.overrides[d];
      if (ov && ov.deleted) continue;
      const o = occ(it, d, ov);
      if (o.date >= from && o.date <= to) out.push(o);
    }
  }
  return out.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
}
function subOccs(from, to){
  const out = [];
  for (const it of S.items.values()) {
    const subs = it.subtasks || [], n = subs.length;
    subs.forEach((x, i) => {
      if (!x.date || !x.start || x.date < from || x.date > to) return;
      const e = Math.min(1439, toMin(x.start) + Math.max(5, +x.dur || 30));
      out.push({key:'sub:' + it.id + ':' + x.id, id:it.id, item:it, sub:x, subNo:i + 1, n, date:x.date, start:x.start, end:fromMin(e), status:x.done ? 'concluida' : 'planejada', rec:false, isSub:true});
    });
  }
  return out;
}
const withSubs = (list, from, to) => list.concat(subOccs(from, to)).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
const occTitle = o => o.isSub ? `${o.subNo}/${o.n} ${o.sub.text} · ${o.item.title}` : o.item.title;
const parentKey = it => isRec(it) ? it.id + '@' + it.date : it.id;
function patchSub(o, patch, msg){

  const x = (it.subtasks || []).find(y => y.id === o.sub.id); if (!x) return;
  Object.assign(x, patch); putItem(it); render(); if (msg) toast(msg);

function findOcc(key){
  if (!key) return null;
  if (key.startsWith('sub:')) { const [, id, sid] = key.split(':'); const it = S.items.get(id); if (!it) return null; return subOccs('0000-01-01', '9999-12-31').find(o => o.key === key) || null; }

function parsePeople(text, type){
  const out = [], bad = [];
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?:[\/.]\d{2,4})?/) || line.match(/\b(\d{1,2})-(\d{1,2})(?:-\d{4})?\b/);
    if (!m) { bad.push(line); continue; }
    const day = +m[1], month = +m[2];
    if (day < 1 || day > 31 || month < 1 || month > 12) { bad.push(line); continue; }
    const rest = (line.slice(0, m.index) + ' ; ' + line.slice(m.index + m[0].length));
    const phoneM = rest.match(/\+?\d[\d\s().\-]{7,}\d/);
    const whatsapp = phoneM ? phoneM[0].replace(/\D/g, '') : '';
    const parts = (phoneM ? rest.replace(phoneM[0], ' ; ') : rest).split(/[;,\t|]| - /).map(x => x.trim()).filter(Boolean);
    const name = parts[0] || ''; const role = type === 'profissional' ? (parts[1] || '') : '';
    if (!name) { bad.push(line); continue; }
    out.push({name:name.slice(0, 80), day, month, whatsapp, role:role.slice(0, 60)});
  }

}

/* ---------- pendências e reagendamento ---------- */
function pendingOccs(){
  const t = todayY();
  return expand(addY(t, -30), addY(t, -1)).filter(o => {
    if (effStatus(o) !== 'pendente') return false;
    if (o.item.autoResched === false) return false;
    if (o.rec) { const ov = o.item.overrides && o.item.overrides[o.origDate]; if (ov && ov.kept) return false; }
    else if (o.item.kept) return false;
    return true;
  });
}
function findSlot(o, taken){
  const st = ST(); const ws = toMin(st.workStart), we = toMin(st.workEnd);
  const dur = Math.max(15, toMin(o.end) - toMin(o.start));
  const tomorrow = addY(todayY(), 1), nextWeek = addY(weekStart(o.date), 7);
  let d = o.item.fixed ? tomorrow : (nextWeek > tomorrow ? nextWeek : tomorrow);
  const deadline = o.item.fixed && o.item.deadline ? o.item.deadline : null;
  if (deadline && deadline < tomorrow) return {o, conflict:`O prazo fixo (${fmtD(deadline)}) já passou. Escolha um novo horário.`};
  for (let i = 0; i < 28; i++, d = addY(d, 1)) {
    if (deadline && d > deadline) return {o, conflict:`Prazo fixo em ${fmtD(deadline)}: não há horário livre antes dele.`};
    if (!st.workDays.includes(dow(d))) continue;
    const busy = activeOn(d).filter(x => x.key !== o.key).map(x => [toMin(x.start), toMin(x.end)]).concat(taken[d] || [], travelSegs(d).map(x => [x.s, x.e]));
    const free = s => s >= ws && s + dur <= we && !busy.some(([a, b]) => s < b && a < s + dur);
    let s = null; const pref = toMin(o.start);
    if (free(pref)) s = pref; else for (let m = ws; m + dur <= we; m += 30) if (free(m)) { s = m; break; }
    if (s !== null) { (taken[d] = taken[d] || []).push([s, s + dur]); return {o, date:d, start:fromMin(s), end:fromMin(s + dur)}; }
  }
  return {o, conflict:'Nenhum horário livre nas próximas 4 semanas.'};
}
function suggestAll(){
  const list = pendingOccs().sort((a, b) => (PRIO[a.item.priority || 'media'].w - PRIO[b.item.priority || 'media'].w) || (a.date + a.start).localeCompare(b.date + b.start));
  const taken = {};
  return list.map(o => findSlot(o, taken));
}
function applySug(s){
  const o = s.o;
  const txt = `Remarcada de ${fmtDW(o.date)} ${fmtH(o.start)} para ${fmtDW(s.date)} ${fmtH(s.start)} (não concluída)`;
  if (o.rec) {
    const it = clone(S.items.get(o.id)); if (!it) return;
    const nid = 'a_' + uid();
    it.overrides = it.overrides || {};
    it.overrides[o.origDate] = {...(it.overrides[o.origDate] || {}), status:'reagendada', movedTo:nid};
    putItem(it);
    const copy = {...clone(it), id:nid, date:s.date, start:s.start, end:s.end, status:'planejada', recur:{freq:'none'}, overrides:{},
      origin:{seriesId:it.id, date:o.origDate}, history:[{at:Date.now(), text:txt}], rescheduledCount:1, autoResched:true, kept:false, createdAt:Date.now()};
    putItem(copy); return nid;
  } else {
    const it = clone(S.items.get(o.id)); if (!it) return;
    Object.assign(it, {date:s.date, start:s.start, end:s.end, status:'planejada', kept:false});
    it.rescheduledCount = (it.rescheduledCount || 0) + 1;
    it.history = [...(it.history || []), {at:Date.now(), text:txt}].slice(-30);
    putItem(it); return it.id;
  }
}
let autoRanFor = null;
function runAuto(){
  return; // remarcar só com autorização do usuário (botões em Pendências)
  const t = todayY(); if (autoRanFor === t) return; autoRanFor = t;
  const sug = suggestAll(); if (!sug.length) return;
  let moved = 0; const conf = [];
  for (const s of sug) { if (s.conflict) conf.push(s); else { applySug(s); moved++; } }
  if (moved) notify('Pendências remarcadas', `${moved} ${plural(moved,'atividade não concluída foi','atividades não concluídas foram')} para a próxima semana. Veja o histórico em Pendências.`, 'resched');
  const fired = loadFired();
  for (const s of conf) { const k = 'conf:' + s.o.key; if (fired.has(k)) continue; fired.add(k); notify('Precisa da sua decisão', `“${s.o.item.title}”: ${s.conflict}`, 'conflict'); }
  saveFired(fired);
}

/* ---------- notificações e lembretes ---------- */
function toast(msg, kind){

  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 5000);

function browserNotify(title, body){ try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, {body, tag:title + body, requireInteraction:true}); } catch {} }
let audioCtx = null;
document.addEventListener('pointerdown', () => { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch {} }, {passive:true});
function chime(){
  try { if (!audioCtx) return; const t = audioCtx.currentTime;
    [880, 1175, 880].forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t + i * .22); g.gain.exponentialRampToValueAtTime(0.25, t + i * .22 + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * .22 + .2); o.connect(g).connect(audioCtx.destination); o.start(t + i * .22); o.stop(t + i * .22 + .22); });
  } catch {}
}
let titleFlash = null;
function flashTitle(msg){

function alertReminder(title, body){

function notify(title, body, type){

function loadFired(){ try { return new Set(JSON.parse(localStorage.getItem(LSK + ':fired') || '[]')); } catch { return window.__fired || (window.__fired = new Set()); } }
function saveFired(set){ const arr = [...set].slice(-300); try { localStorage.setItem(LSK + ':fired', JSON.stringify(arr)); } catch { window.__fired = new Set(arr); } }
function checkReminders(){
  if (!S.loaded) return;
  const t = todayY(), now = Date.now(); const fired = loadFired(); let changed = false;
  for (const o of withSubs(expand(t, addY(t, 1)), t, addY(t, 1))) {
    const r = +o.item.reminder || 0; if (!r || effStatus(o) !== 'planejada') continue;
    const startTs = parse(o.date).getTime() + toMin(o.start) * 60000, fire = startTs - r * 60000;
    if (now < fire || now > startTs) continue;

    notify('Lembrete', body, 'reminder'); alertReminder('Lembrete', body);
  }
  if (changed) saveFired(fired);
}

      ${sg.conflict ? `<div class="info bad">${esc(sg.conflict)}</div>` : `<div class="info">Sugestão da agenda: ${fmtDL(sg.date)}, ${fmtH(sg.start)}. Você pode trocar.</div>`}

function pendSug(key){
  const s = suggestAll().find(x => x.o.key === key); if (!s) return null;

/* ---------- resumo semanal ---------- */
function weekStats(ws){
  const we = addY(ws, 6); const l = expand(ws, we).filter(o => o.status !== 'reagendada');
  const st = {total:l.length, done:0, pend:0, canc:0, plan:0, days:Array.from({length:7}, () => ({total:0, done:0})), cats:{}, pendList:[], cancList:[]};
  for (const o of l) {
    const es = effStatus(o), i = dayDiff(ws, o.date), mins = toMin(o.end) - toMin(o.start);
    st.days[i].total++;
    const c = (st.cats[o.item.category || ''] = st.cats[o.item.category || ''] || {plan:0, done:0});
    if (es !== 'cancelada') c.plan += mins;
    if (es === 'concluida') { st.done++; st.days[i].done++; c.done += mins; }
    else if (es === 'pendente') { st.pend++; st.pendList.push(o); }
    else if (es === 'cancelada') { st.canc++; st.cancList.push(o); }
    else st.plan++;
  }
  st.rate = st.total - st.canc > 0 ? Math.round(st.done / (st.total - st.canc) * 100) : 0;
  return st;
}
function weekLabel(ws){ const we = addY(ws, 6); return `${fmtD(ws)} a ${fmtD(we)}`; }
function chartSVG(st){
  const W = 560, H = 220, L = 34, B = 30, T = 18, max = Math.max(1, ...st.days.map(d => d.total));
  const step = Math.max(1, Math.ceil(max / 4)), top = step * Math.ceil(max / step);
  const y = v => T + (H - T - B) * (1 - v / top), bw = (W - L - 10) / 7;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const labels = WD;
  st.days.forEach((d, i) => {
    const x = L + i * bw + bw * .2, w = bw * .6;
    g += `<rect x="${x}" y="${y(d.total)}" width="${w}" height="${y(0) - y(d.total)}" rx="4" fill="var(--soft)" stroke="var(--line)"/>`;
    if (d.done) g += `<rect x="${x}" y="${y(d.done)}" width="${w}" height="${y(0) - y(d.done)}" rx="4" fill="var(--accent)"/><text class="v" x="${x + w / 2}" y="${y(d.done) - 6}" text-anchor="middle">${d.done}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Atividades concluídas por dia">${g}</svg>`;
}

    if (act === 'notiftest') { notify('Lembrete', 'Teste: assim você será avisado das suas atividades.', 'reminder'); alertReminder('Lembrete', 'Teste: assim você será avisado das suas atividades.'); return; }
    if (act === 'notifperm') { try { await Notification.requestPermission(); } catch {} render(); return; }
    if (act === 'catadd') { const s = ensureSettings(); const palette = ['#0EA5A4','#C2410C','#4D7C0F','#7C3AED','#BE185D','#0369A1']; s.categories = [...s.categories, {id:'c_' + uid(), name:'Nova categoria', color:palette[s.categories.length % palette.length]}]; saveSettings(); return; }
    if (act === 'catdel') { const s = ensureSettings(); const i = +a.dataset.i; const c = s.categories[i]; const used = [...S.items.values()].filter(it => it.category === c.id).length; const v = await ask('Remover categoria', used ? `“${c.name}” é usada por ${used} ${plural(used,'atividade','atividades')}. Elas ficam sem categoria.` : `Remover “${c.name}”?`, [{label:'Cancelar', value:null}, {label:'Remover', value:'y', kind:'btn-danger'}]); if (!v) return; s.categories = s.categories.filter((_, j) => j !== i); saveSettings(); return; }
    if (act === 'export') { const data = JSON.stringify({app:'agenda-inteligente', version:1, exportedAt:new Date().toISOString(), settings:S.settings, items:[...S.items.values()], travels:[...S.travels.values()], people:[...S.people.values()]}, null, 1); try { await S.caps.downloads.save({filename:`agenda-copia-${todayY()}.json`, data}); toast('Cópia de segurança salva.'); } catch (err) { if (err && err.code !== 'declined') toast('Não foi possível salvar a cópia agora.', 'warn'); } return; }
    if (act === 'wipe') { const v = await ask('Apagar todas as atividades', `Isso apaga as ${S.items.size} atividades e seus anexos. Não dá para desfazer. Exporte uma cópia antes, se quiser guardar.`, [{label:'Cancelar', value:null}, {label:'Apagar tudo', value:'y', kind:'btn-danger'}]); if (!v) return; for (const id of [...S.items.keys()]) delItem(id); render(); toast('Todas as atividades foram apagadas.'); return; }
    return;
  }
  if (Date.now() - S.suppressClick < 350) return;
  const cell = t.closest('.m-cell');
  if (cell && !t.closest('.chip')) { openEditor(null, {date:cell.dataset.date, start:'09:00', end:'10:00'}); }
});
document.addEventListener('mouseover', e => { S.hoverEl = e.target.closest ? e.target.closest('.ev, .chip') : null; });
document.addEventListener('mousemove', e => {
  const col = e.target.closest ? e.target.closest('.g-col') : null;
  S.hoverSlot = col && !e.target.closest('.ev') ? {date:col.dataset.date, m:quarterAt(col, e.clientY)} : null;
}, {passive:true});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && ((e.key || '').toLowerCase() === 'z' || (e.key || '').toLowerCase() === 'y')) {
    const a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // no texto, desfaz a digitação normalmente
    if ($('.overlay') || S.dragging || S.readOnly) return;
    e.preventDefault();
    if ((e.key || '').toLowerCase() === 'y' || e.shiftKey) Undo.doRedo(); else Undo.doUndo();
    return;
  }
  const mod = (e.ctrlKey || e.metaKey) && !e.altKey, k = (e.key || '').toLowerCase();
  const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
  if (mod && k === 'c' && !typing() && !$('.overlay')) {
    const a = document.activeElement;
    const el = a && a.matches && a.matches('.ev, .chip') ? a : (S.hoverEl && S.hoverEl.isConnected ? S.hoverEl : null);
    const o = el && findOcc(el.dataset.key);
    if (o) { e.preventDefault(); copyOcc(o, el); }
    return;
  }
  if (mod && k === 'v' && S.clip && !$('.overlay')) {
    if (quick && e.target === quick.inp && !quick.inp.value) { e.preventDefault(); const q = quick; q.done = true; quick = null; q.el.remove(); pasteAt(q.date, q.a); return; }
    if (!typing() && S.hoverSlot) { e.preventDefault(); pasteAt(S.hoverSlot.date, S.hoverSlot.m); }
    return;
  }
  if (e.key === 'Escape' && S.pasteMode && !$('.overlay')) { S.pasteMode = false; render(); return; }
  if (e.key === 'Escape') { if (S.popOpen) { S.popOpen = false; renderPop(); } else closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.ev, .chip')) { e.preventDefault(); openEditor(e.target.dataset.key); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-in') { e.preventDefault(); const v = e.target.value; e.target.value = ''; sendChat(v); }
});
document.addEventListener('submit', e => { if (e.target.id === 'pe-form') { e.preventDefault(); const name = $('#pe-name').value.trim(); if (!name) { $('#pe-name').focus(); return; } const pe = addPerson(S.peopleTab, {name:name.slice(0, 80), day:$('#pe-day').value, month:$('#pe-month').value, role:$('#pe-role') ? $('#pe-role').value.trim() : ''}); if (pe) { render(); toast(`${pe.name} salvo para ${pad(pe.day)}/${pad(pe.month)}.`); setTimeout(() => { const n = $('#pe-name'); if (n) n.focus(); }, 0); } return; }
  if (e.target.id === 'chat-form') { e.preventDefault(); const i = $('#chat-in'); const v = i.value; i.value = ''; sendChat(v); } });
document.addEventListener('change', async e => {
  const t = e.target; if (t.closest('.overlay')) return;
  if (t.dataset.cat !== undefined) { t.checked ? S.hidden.delete(t.dataset.cat) : S.hidden.add(t.dataset.cat); render(); return; }
  if (t.id === 'lrange') { S.listRange = t.value; render(); return; }
  if (t.id === 'lstatus') { S.listStatus = t.value; render(); return; }
  if (t.dataset.peF) { const pe = S.people.get(t.dataset.id); if (!pe) return; let v = t.value.trim(); if (t.dataset.peF === 'whatsapp') v = v.replace(/\D/g, ''); if (t.dataset.peF === 'name' && !v) { t.value = pe.name; return; } pe[t.dataset.peF] = v; Store.write(pe.id); t.blur(); render(); return; }
  if (t.dataset.pe) { const k = t.dataset.key; S.pendEdits[k] = {...(S.pendEdits[k] || {}), [t.dataset.pe]:t.value}; return; }
  if (t.id === 's-ws' || t.id === 's-we') { const s = ensureSettings(); const v = validT(t.value); if (!v) return; if (t.id === 's-ws') s.workStart = v; else s.workEnd = v; if (toMin(s.workEnd) <= toMin(s.workStart)) { toast('O fim do horário útil precisa ser depois do início.', 'warn'); return; } saveSettings(); return; }
  if (t.dataset.sday !== undefined) { const s = ensureSettings(); const g = +t.dataset.sday; const set = new Set(s.workDays); t.checked ? set.add(g) : set.delete(g); s.workDays = [...set].sort(); saveSettings(); return; }
  if (t.dataset.catcolor !== undefined) { const s = ensureSettings(); s.categories = s.categories.map((c, i) => i === +t.dataset.catcolor ? {...c, color:t.value} : c); saveSettings(); return; }
  if (t.dataset.catname !== undefined) { const s = ensureSettings(); const v = t.value.trim().slice(0, 40); if (!v) return; s.categories = s.categories.map((c, i) => i === +t.dataset.catname ? {...c, name:v} : c); t.blur(); saveSettings(); return; }
  if (t.id === 'imp' && t.files[0]) {
    try {
      const o = JSON.parse(await t.files[0].text()); const items = Array.isArray(o.items) ? o.items.filter(x => x && x.id && x.title && validY(x.date)) : [];
      if (!items.length) throw 0;
      const v = await ask('Importar cópia', `Importar ${items.length} ${plural(items.length,'atividade','atividades')}? Atividades com o mesmo código serão substituídas.`, [{label:'Cancelar', value:null}, {label:'Importar', value:'y', kind:'btn-primary'}]);
      if (v) { if (o.settings) { S.settings = normSettings(o.settings); Store.write('settings'); } for (const it of items) putItem({...it, kind:'activity'}); for (const pe of Array.isArray(o.people) ? o.people : []) if (pe && pe.id && pe.name) { S.people.set(pe.id, {...pe, kind:'person'}); Store.write(pe.id); } for (const tr of Array.isArray(o.travels) ? o.travels : []) if (tr && tr.id && validY(tr.date) && validY(tr.endDate)) { S.travels.set(tr.id, {...tr, kind:'travel'}); Store.write(tr.id); } render(); toast('Cópia importada.'); }
    } catch { toast('Esse arquivo não é uma cópia de segurança da agenda.', 'warn'); }
    t.value = '';
  }
});
let qTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.q = e.target.value.trim(); if (S.q) { S.tab = 'agenda'; S.view = 'list'; } render(); }, 200);
});
document.addEventListener('focusout', () => setTimeout(() => {
  if (!S.pendingRender || S.dragging) return;
  const a = document.activeElement; if (a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  render();
}, 0));
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.tab && TABS.some(x => x[0] === h)) setTab(h); });

/* ---------- relógio ---------- */
setInterval(() => {
  if (todayY() !== S.lastDay) { S.lastDay = todayY(); runAuto(); scheduleRender(); }
  else if (S.tab === 'agenda' && !S.dragging) {
    const nl = $('.nowline'); if (nl) nl.style.top = ((nowMin() - HOUR_START * 60) / 60 * PPH) + 'px';
  }
  checkReminders();
}, 30000);

/* ---------- início ---------- */
(() => { const h = location.hash.slice(1); if (TABS.some(x => x[0] === h)) S.tab = h; })();
render();
Store.start().catch(() => { Store.loadLocal(); render(); });
</script>
</body>
</html>
